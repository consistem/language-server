name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".vscode/**"
      - ".github/**"
      - "*.md"
      - "**/*.md"
  pull_request:
    branches:
      - master
  release:
    types:
      - released

concurrency:
  group: ${{ github.workflow }}-${{ github.base_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platarch: [win32-x64, win32-arm64, linux-x64, linux-arm64, alpine-x64, alpine-arm64, darwin-x64, darwin-arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set package name and version
        id: set-version
        run: |
          set -x
          VERSION=$(jq -r '.version' package.json | cut -d- -f1)
          [ $GITHUB_EVENT_NAME == 'release' ] && VERSION=${{ github.event.release.tag_name }} && VERSION=${VERSION/v/}
          git tag -l | cat
          [ $GITHUB_EVENT_NAME == 'push' ] && VERSION+=-beta && VERSION+=.$(($(git tag -l "v$VERSION.*" | sort -nt. -k4 2>/dev/null | tail -1 | cut -d. -f4)+1))
          [ $GITHUB_EVENT_NAME == 'pull_request' ] && VERSION+=-dev.${{ github.event.pull_request.number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          NAME=$(jq -r '.name' package.json)-$VERSION-${{ matrix.platarch }}
          echo "name=$NAME" >> $GITHUB_OUTPUT
          tmp=$(mktemp)
          jq --arg version "$VERSION" '.version = $version' package.json > "$tmp" && mv "$tmp" package.json
          echo $VERSION > meta.version
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Build package
        env:
          ISCLEXER_TARGET: ${{ matrix.platarch }}
        run: npx vsce package -o ${{ steps.set-version.outputs.name }}.vsix --target ${{ matrix.platarch }}
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-version.outputs.name }}.vsix
          path: ${{ steps.set-version.outputs.name }}.vsix
          retention-days: 30
      - name: Upload metadata
        if: matrix.platarch == 'linux-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: meta
          retention-days: 1
          path: meta.version
  beta:
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.event_name == 'push'
    steps:
      - name: Download metadata
        uses: actions/download-artifact@v8
        with:
          name: meta
          path: .
      - name: Set version output
        id: set-version
        run: |
          set -x
          echo "version=`cat meta.version`" >> $GITHUB_OUTPUT
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
         pattern: '**/*.vsix'
      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.set-version.outputs.version }}
          prerelease: ${{ github.event_name != 'release' }}
          files: '**/*.vsix'
          token: ${{ secrets.GITHUB_TOKEN }}
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: write
    if: success() && github.event_name == 'release'
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
      - name: Attach packages to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: '**/*.vsix'
          body: See CHANGELOG for details
          token: ${{ secrets.GITHUB_TOKEN }}
